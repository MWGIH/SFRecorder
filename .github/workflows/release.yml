# Builds SFRecorder and its private FFmpeg for the Steam Frame (aarch64) and
# attaches both to a GitHub release, where install.sh downloads them from.
#
# Every push to main publishes a release v0.1.<run number>, which becomes the
# latest one install.sh downloads. A tag like v0.2.0 also makes a release.
# Pushes to the test branch (or a run by hand from the Actions tab) update
# the "test" pre-release.
name: Release

on:
  push:
    tags: ["v*"]
    # Test builds: every push to this branch updates the "test" pre-release.
    branches: ["main", "claude/project-thread-vjosj1"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        default: "test"

# One build at a time, so two quick pushes can't race on the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Older Ubuntu = older glibc, so the binaries also run on older systems.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev glslang-tools \
            libvulkan-dev libdrm-dev libpulse-dev curl xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - name: Build FFmpeg (AAC + MP4 only)
        run: scripts/build-ffmpeg.sh

      - name: Build SFRecorder against it
        env:
          # Shown in the tab and by `sfrecorder --version`.
          SFRECORDER_VERSION: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || (github.ref_name == 'main' && format('v0.1.{0}', github.run_number)) || 'test' }}
        run: PKG_CONFIG_PATH="$PWD/build/ffmpeg/lib/pkgconfig" cargo build --release --locked

      - name: Package
        run: |
          tar -czf sfrecorder-aarch64.tar.gz -C target/release sfrecorder sfrecorder-grab
          ls -la *.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || (github.ref_name == 'main' && format('v0.1.{0}', github.run_number)) || 'test' }}
        run: |
          # Test-branch and hand-run builds, and tags like v0.1.0-test1, are
          # test pre-releases; main builds and plain tags are releases.
          case "${{ github.ref_name }}:$TAG" in main:*) pre= ;; *:test|*-*) pre=--prerelease ;; *) pre= ;; esac
          # A test release always points at the build it holds.
          if [ "$TAG" = test ]; then gh release delete test --cleanup-tag --yes 2>/dev/null || true; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $pre --target "$GITHUB_SHA" --title "$TAG" --notes "Built from $GITHUB_SHA"
          gh release upload "$TAG" sfrecorder-aarch64.tar.gz ffmpeg-libs-aarch64.tar.gz --clobber
